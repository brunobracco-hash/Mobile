[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2kindle"
version = "1.0.0"
description = "Converte PDF em .docx refluível e diagramado para leitura no Kindle"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdf2kindle = "pdf2kindle.cli:main"
pdf2kindle-web = "pdf2kindle.web:main"

[tool.setuptools]
packages = ["pdf2kindle"]

[tool.setuptools.package-data]
pdf2kindle = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
