name: Gerar APK

on:
  push:
    branches:
      - claude/household-expense-tracker-app-jb6ucl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de release
        env:
          # Se os secrets existirem, eles tem prioridade sobre o gradle.properties.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Conferir que o APK saiu configurado
        # Confere o artefato de verdade, nao a configuracao: se as credenciais
        # nao chegaram ao BuildConfig por qualquer motivo, o build falha aqui
        # em vez de publicar um APK que so mostra "nao configurado" no celular.
        run: |
          # O BuildConfig vira classes.dex, que fica comprimido dentro do APK:
          # e preciso descompactar antes de procurar a string.
          rm -rf /tmp/apkcheck
          unzip -q -o app/build/outputs/apk/release/app-release.apk -d /tmp/apkcheck
          if ! grep -qar "supabase.co" /tmp/apkcheck; then
            echo "::error::APK gerado sem as credenciais do Supabase."
            exit 1
          fi
          echo "APK contem as credenciais."

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/gastos.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gastos-apk
          path: dist/gastos.apk
          retention-days: 90

      - name: Publicar release para download no celular
        uses: softprops/action-gh-release@v2
        with:
          # Tag exclusiva deste app: o repositorio hospeda mais de um projeto
          # e uma tag generica sobrescreveria a release do outro.
          tag_name: gastos-latest
          name: Gastos - ultima versao
          body: |
            APK pronto para instalar. Baixe `gastos.apk` pelo proprio celular
            e abra o arquivo para instalar.

            Build: ${{ github.sha }}
          files: dist/gastos.apk
